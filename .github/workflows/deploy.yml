name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -q

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH Connection
        run: ssh -i ~/.ssh/deploy_key -v root@${{ secrets.SERVER_IP }} "echo SSH OK"
        continue-on-error: true

      - name: Deploy JAR with SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/api-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/fortal-cloud-backend/"
          overwrite: true
          strip_components: 1

      - name: Restart Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/fortal-cloud-backend
            systemctl restart fortal-cloud.service
            sleep 3
            systemctl is-active fortal-cloud.service

      - name: Test API
        run: |
          sleep 5
          curl -f https://api.fortal-cloud.com.br/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{}' || true