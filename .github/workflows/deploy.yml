name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/deploy_key << 'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy JAR to server
        run: |
          scp -i ~/.ssh/deploy_key \
            target/api-0.0.1-SNAPSHOT.jar \
            root@${{ secrets.SERVER_IP }}:/home/ubuntu/fortal-cloud-backend/

      - name: Restart application
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_IP }} \
            'systemctl restart fortal-cloud.service && sleep 5'

      - name: Test deployment
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_IP }} \
            'curl -X POST https://api.fortal-cloud.com.br/api/auth/login \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"garciasusana21@gmail.com\",\"password\":\"123456\"}" \
              | grep -q "token" && echo "✅ Deploy successful!" || exit 1'

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key